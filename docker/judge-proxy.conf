map $http_host $judge_host_allowed {
    default 0;
    "localhost:8000" 1;
    "127.0.0.1:8000" 1;
    "judge-proxy:8080" 1;
}

server {
    listen 8080 default_server;
    server_tokens off;

    if ($judge_host_allowed = 0) {
        return 403;
    }

    if ($request_uri !~ "^/[A-Za-z0-9_./-]*(\?.*)?$") {
        return 400;
    }

    if ($request_uri ~ "^[^?]*(\.\.|//)") {
        return 400;
    }

    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://judge:8000/health;
    }

    location ^~ /v1/ {
        limit_except GET POST { deny all; }
        proxy_pass http://judge:8000/v1/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        return 404;
    }
}
